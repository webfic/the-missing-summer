version: 1.0.0
acts:
  - id: act-1
    title: 돌아온 목격자
    summary: 서연은 폐항과 재개발을 앞둔 고향 해솔포로 돌아와, 어린 시절 친구 하린의 실종 기록이 자신을 유일한 목격자로 남겼음을 다시 확인했다. 가족과 마을이 피하던 과거는 재개발 보상금 합의를 계기로 다시 흔들렸다.
    chapters:
      - id: chapter-1
        title: 빈 항구
        summary: 서연은 어머니 복순의 부름으로 귀향했고, 폐항을 앞둔 항구에서 실종 사건의 흔적과 마을의 노골적인 불편함을 마주했다.
        targetWordCount: 12000
        scenes:
          - id: scene-1-1
            title: 돌아온 배
            purpose: 서연이 해솔포에 돌아와 폐항 직전의 마을 분위기와 자신의 귀향 이유를 제시했다.
            characters:
              - seoyeon
              - boksun
            location: 해솔포 여객선 선착장
            conflict: 복순은 서연에게 보상금 서류만 처리하고 떠나라고 했고, 서연은 20년 전 일이 끝나지 않았다고 느꼈다.
            twist: 선착장 안내판의 폐항 예정일이 하린 실종 기념일과 같은 날짜였고, 서연은 이를 우연으로 넘기지 못했다.
            emotionalShift: 서연은 낯선 방문객처럼 내렸으나, 항구의 냄새를 맡고 발걸음을 멈췄다.
            foreshadowing:
              - 폐항 예정일과 하린 실종 기념일의 일치
              - 복순이 숨긴 낡은 방파제 사진
            neededCanon:
              - 해솔포는 가상의 남해 어촌이며 폐항과 재개발을 앞두고 있었다.
              - 서연은 서른일곱 살로 20년 만에 귀향했다.
              - 복순은 서연의 어머니였다.
            targetWordCount: 3000
          - id: scene-1-2
            title: 잠긴 방
            purpose: 서연이 어린 시절 방에서 자신의 기억을 자극하는 물건을 발견했다.
            characters:
              - seoyeon
              - boksun
            location: 복순의 집 서연의 옛방
            conflict: 서연은 상자를 열려 했고, 복순은 과거 물건을 버렸다고 둘러댔다.
            twist: 상자에는 하린의 이름이 적힌 조개 팔찌 한 짝과 젖은 종이 조각이 남아 있었다.
            emotionalShift: 서연은 복순의 회피에 물러섰다가, 팔찌를 쥐고 다시 질문할 마음을 굳혔다.
            foreshadowing:
              - 조개 팔찌의 끊어진 매듭
              - 젖은 종이에 남은 숫자 17
            neededCanon:
              - 하린은 서연과 같은 또래였고 20년 전 실종 처리됐다.
              - 서연은 자신이 하린을 방파제로 따라가는 모습을 봤다고 믿어 왔다.
            targetWordCount: 3000
          - id: scene-1-3
            title: 보상 설명회
            purpose: 재개발 보상금이 마을 사람들의 침묵을 지탱하는 현실적 압력임을 드러냈다.
            characters:
              - seoyeon
              - boksun
              - myeongtae
              - jinu
            location: 해솔포 마을회관
            conflict: 서연은 공개 기록에 하린 사건이 빠진 이유를 묻고, 명태와 진우는 설명회를 방해하지 말라고 했다.
            twist: 보상 대상 도면에 옛 어구 창고 구역만 별도 정비 대상으로 표시돼 있었다.
            emotionalShift: 서연은 수군거림에 움츠러들었으나, 도면을 접어 가방에 넣었다.
            foreshadowing:
              - 별도 정비 대상으로 표시된 옛 어구 창고
              - 명태가 도면에서 급히 가린 방파제 구간
            neededCanon:
              - 명태는 마을 재개발 보상 협의를 주도했다.
              - 진우는 당시 또래였으며 현재 항구 일을 맡고 있었다.
              - 마을은 보상금 합의 직전이었다.
            targetWordCount: 3000
          - id: scene-1-4
            title: 남은 목격자
            purpose: 서연이 자신이 유일한 목격자라는 기록의 모순을 발견하고 재조사를 결심했다.
            characters:
              - seoyeon
              - harin
            location: 해솔포 작은 도서관 향토자료실
            conflict: 서연은 사건 기사 속 자신의 진술을 읽으며, 기억과 다른 표현에 흔들렸다.
            twist: 기사에는 익명의 두 번째 아이가 있었다는 초기 제보가 짧게 실려 있었다.
            emotionalShift: 서연은 자신을 탓하던 기억에서 벗어나, 기록을 추적할 대상이 생겼다고 느꼈다.
            foreshadowing:
              - 초기 기사 속 익명의 두 번째 아이
              - 기사에서 잘려 나간 사진의 오른쪽 가장자리
            neededCanon:
              - 하린 사건은 당시 실종 사건으로 보도됐다.
              - 공식 기록은 서연을 유일한 목격자로 정리했다.
              - 하린은 현재까지 실종 상태로 남아 있었다.
            targetWordCount: 3000
      - id: chapter-2
        title: 다시 열린 기록
        summary: 서연은 당시의 기록과 증언을 모으기 시작했고, 진우와 명태가 공유하는 불안을 통해 사건이 단순 실종이 아니었을 가능성을 좁혔다.
        targetWordCount: 12000
        scenes:
          - id: scene-2-1
            title: 지워진 문장
            purpose: 서연이 사건 기록의 누락을 확인하고 진우를 첫 증언 대상으로 삼았다.
            characters:
              - seoyeon
              - jinu
            location: 해솔포 수협 창고 앞
            conflict: 진우는 과거를 기억하지 못한다고 했고, 서연은 그가 기사 속 두 번째 아이일 수 있다고 압박했다.
            twist: 진우는 서연이 본 것은 하린 혼자가 아니었다고 무심코 인정했다.
            emotionalShift: 서연은 의심을 확신으로 바꾸었고, 진우는 작업 장갑을 벗지 못한 채 자리를 피했다.
            foreshadowing:
              - 진우 손등의 오래된 갈고리 흉터
              - 진우가 말한 태풍 전날의 경보음
            neededCanon:
              - 진우는 하린과 서연의 또래였다.
              - 진우는 현재 수협과 항구 물류 일을 했다.
              - 사건 당시 태풍이 접근하고 있었다.
            targetWordCount: 3000
          - id: scene-2-2
            title: 방파제의 금
            purpose: 서연이 방파제에서 기억의 공백과 물리적 단서를 연결했다.
            characters:
              - seoyeon
              - jinu
            location: 옛 방파제 끝
            conflict: 서연은 진우에게 당시 동선을 묻고, 진우는 파도 탓에 아무것도 볼 수 없었다고 버텼다.
            twist: 방파제 보수 콘크리트 아래에서 숫자 17이 찍힌 오래된 금속 표지를 발견했다.
            emotionalShift: 서연은 흐릿한 회상에 매달리던 태도에서 기록을 확인하려는 태도로 옮겨갔다.
            foreshadowing:
              - 방파제 보수 표지의 숫자 17
              - 콘크리트 틈의 파란 밧줄 조각
            neededCanon:
              - 옛 방파제는 실종 직후 일부 보수됐다.
              - 서연의 기억에는 비와 경보음, 파란 밧줄이 남아 있었다.
            targetWordCount: 3000
          - id: scene-2-3
            title: 어머니의 봉투
            purpose: 복순이 사건 뒤 서연을 보호하려 했던 사실과 그 한계를 드러냈다.
            characters:
              - seoyeon
              - boksun
            location: 복순의 집 부엌
            conflict: 서연은 복순이 왜 기록을 숨겼는지 따졌고, 복순은 아이를 지키려 했다고 답했다.
            twist: 복순은 실종 다음 날 명태가 가져온 봉투를 아직 버리지 못했다고 털어놓았다.
            emotionalShift: 서연은 어머니에게 등을 돌리려다 봉투를 받으며 배신감과 연민 사이에서 멈췄다.
            foreshadowing:
              - 명태가 가져온 봉투의 방파제 보수 영수증
              - 봉투 안의 어구 창고 열쇠표
            neededCanon:
              - 복순은 사건 뒤 서연의 진술을 반복 연습시켰다.
              - 명태는 당시 마을 어촌계의 실무 책임자였다.
              - 서연은 복순이 자신을 보호했다는 명분을 믿기 어려웠다.
            targetWordCount: 3000
          - id: scene-2-4
            title: 창고의 냄새
            purpose: 서연이 옛 어구 창고가 사건 당일 은폐에 쓰였을 가능성을 발견했다.
            characters:
              - seoyeon
              - myeongtae
            location: 폐쇄된 옛 어구 창고
            conflict: 서연은 열쇠표로 창고에 들어가려 했고, 명태는 재개발 구역 무단출입이라며 막았다.
            twist: 창고 바닥에서 하린의 팔찌와 같은 조개 조각, 오래된 소독약 냄새를 발견했다.
            emotionalShift: 서연은 막연한 추측을 버리고 창고를 핵심 현장으로 받아들였다.
            foreshadowing:
              - 창고 바닥의 조개 조각
              - 지워진 들것 바퀴 자국
              - 명태가 숨긴 보수대장 사본
            neededCanon:
              - 옛 어구 창고는 실종 당시에도 사용 중이었다.
              - 창고는 재개발로 철거될 예정이었다.
              - 명태는 창고 출입을 강하게 통제했다.
            targetWordCount: 3000
      - id: chapter-3
        title: 합의 전야
        summary: 서연은 철거와 보상금 합의가 임박한 가운데, 하린을 둘러싼 기억이 어른들의 선택으로 다듬어졌다는 사실을 확인했다.
        targetWordCount: 12000
        scenes:
          - id: scene-3-1
            title: 두 번째 아이
            purpose: 서연이 진우에게서 사건 당일 아이들이 위험한 장난을 했다는 첫 진술을 얻었다.
            characters:
              - seoyeon
              - jinu
            location: 새벽 수협 부두
            conflict: 진우는 자신도 처벌받을 수 있다며 입을 다물려 했고, 서연은 하린의 이름이 지워진 대가를 물었다.
            twist: 진우는 아이들이 창고의 구조용 밧줄을 가져가 방파제에서 장난쳤다고 고백했다.
            emotionalShift: 서연은 진우를 가해자로 단정하려다, 그가 떨며 손을 씻는 모습을 보고 더 큰 책임의 방향을 의심했다.
            foreshadowing:
              - 구조용 파란 밧줄의 용도
              - 진우의 갈고리 흉터가 생긴 경위
            neededCanon:
              - 사건 당시 서연·하린·진우는 모두 미성년이었다.
              - 아이들은 어른의 감독 없이 항구 주변을 오갔다.
              - 구조용 밧줄은 옛 어구 창고에 보관됐다.
            targetWordCount: 3000
          - id: scene-3-2
            title: 바뀐 진술
            purpose: 서연이 자신의 목격 진술이 복순과 명태의 개입으로 바뀌었음을 확인했다.
            characters:
              - seoyeon
              - boksun
              - myeongtae
            location: 복순의 집 거실
            conflict: 서연은 봉투 속 초안을 들이밀었고, 복순과 명태는 서로 책임을 미뤘다.
            twist: 초안에는 서연이 창고 쪽에서 어른들의 목소리를 들었다는 문장이 지워져 있었다.
            emotionalShift: 서연은 자신이 기억을 잃은 사람이 아니라 기억을 고치도록 강요받은 사람이었음을 받아들였다.
            foreshadowing:
              - 지워진 어른들의 목소리 문장
              - 명태가 언급을 피한 경보음 이후의 시간
            neededCanon:
              - 복순과 명태는 사건 직후 서연의 곁에 있었다.
              - 서연의 공식 진술은 반복된 면담 뒤 작성됐다.
              - 명태는 사건의 세부 시간을 알고 있었다.
            targetWordCount: 3000
          - id: scene-3-3
            title: 철거 통지
            purpose: 서연이 철거 일정 때문에 증거 확보를 서둘러야 하는 상황을 만들었다.
            characters:
              - seoyeon
              - myeongtae
              - jinu
            location: 옛 어구 창고 앞 재개발 공고판
            conflict: 명태는 다음 날 창고 철거를 공지했고, 서연은 자료 보존을 요구했으나 주민들은 보상금 지연을 우려했다.
            twist: 공고판 뒤에서 누군가 보수대장 사본의 한 장을 숨겨 두었던 사실이 드러났다.
            emotionalShift: 서연은 혼자 파고드는 태도에서 진우에게 공개 증언을 요구하는 태도로 바뀌었다.
            foreshadowing:
              - 보수대장에 비어 있는 구조 요청 시간
              - 철거 전날 밤 창고에 남은 누군가의 발자국
            neededCanon:
              - 보상금 합의는 창고 철거와 연동돼 있었다.
              - 진우는 사건의 일부를 알고도 말하지 않았다.
              - 서연은 증거 보존을 요청할 근거를 모으고 있었다.
            targetWordCount: 3000
          - id: scene-3-4
            title: 태풍의 이름
            purpose: 서연이 당시 기상 기록과 방파제 보수 기록의 시간 차이를 발견해 사고 은폐 가설을 세웠다.
            characters:
              - seoyeon
              - harin
            location: 도서관 향토자료실
            conflict: 서연은 불완전한 자료만으로 결론을 내릴까 망설였고, 하린의 사진 앞에서 과거 기억이 흔들렸다.
            twist: 태풍 경보 발령 전 이미 방파제 보수 인력이 호출됐다는 기록을 찾아냈다.
            emotionalShift: 서연은 자신이 버려졌다는 기억에 붙들리다, 누군가 하린을 발견한 뒤 시간을 잃었다는 결론으로 나아갔다.
            foreshadowing:
              - 경보 발령 전의 보수 인력 호출
              - 사진 오른쪽 가장자리의 어른 작업복
            neededCanon:
              - 당시 태풍은 사고 당일 밤 해솔포에 접근했다.
              - 방파제 보수 기록은 어촌계가 관리했다.
              - 하린의 사진은 사건 직전 촬영된 것이었다.
            targetWordCount: 3000
  - id: act-2
    title: 침묵의 균열
    summary: 서연은 창고와 방파제의 기록을 연결하며, 아이들의 장난 뒤 어른들이 구조를 늦추고 사건을 실종으로 정리했을 가능성을 추적했다. 증언자들은 보상금과 책임 사이에서 갈라졌다.
    chapters:
      - id: chapter-4
        title: 닫힌 창고
        summary: 철거를 앞둔 창고에서 물증을 확보하려는 서연은 명태의 저지와 진우의 망설임 속에서 사건 당일의 구조 지연을 구체화했다.
        targetWordCount: 12000
        scenes:
          - id: scene-4-1
            title: 밤의 열쇠
            purpose: 서연과 진우가 철거 전 창고 안의 기록을 확보하도록 했다.
            characters:
              - seoyeon
              - jinu
