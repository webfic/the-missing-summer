  - sceneStem: 12-scene-3-4
    checkedAt: '2026-08-23T14:47:06.505Z'
    revisionCount: 2
    remainingBlocking: 1
    instructions:
      - '반복 ("“태풍 경보 발령 시각보다 앞선 줄에서 멎었다.” 이후 “경보 전부터”, “경보보다 앞선 시간”이 여러 차례 반복된다."): 경보 이전 보수 인력 호출이라는 발견은 초반에 한 번 분명히 제시한 뒤, 이후에는 빈 서명란·호출 사유·사진 속 작업복의 신원처럼 새 단서로 전진시켜라.'
      - '반복 ("하린이 사진을 꺼내고, 뒤집고, 다시 꺼내고, 내려놓는 동작이 반복된다."): 사진을 다루는 동작은 핵심 전환 지점에만 남기고, 나머지는 시선이나 질문의 변화로 치환해 장면의 호흡을 줄여라.'
      - '캐릭터 보이스 ("“내일 묻기 전에, 오늘은 이걸 옮겨 적을게.”"): 서연은 외운 뒤 나중에 옮겨 적는 인물이므로, 여기서는 먼저 시간을 외우거나 머릿속으로 반복한 뒤 보관실을 나와 옮겨 적게 조정하라.'
    preservedOriginal: false
