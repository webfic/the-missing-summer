  - sceneStem: 16-scene-4-4
    checkedAt: '2026-08-23T15:10:40.335Z'
    revisionCount: 2
    remainingBlocking: 1
    instructions:
      - '장면 목적 ("“그날 함께 있던 아이는 실제로 셋이었습니다.”"): 진우가 곧바로 실제 동행자 수를 공개해 버려, 축소된 고백에 실망하면서도 명태를 두려워함을 읽는 감정 변화가 약해진다. 이 장면에서는 ‘한 명뿐’이라는 정정과 서명 거부까지만 두고, 실제 셋이라는 사실은 이후 장면에서 회수하라.'
      - '캐릭터 보이스 ("“제가 아직 못 쓴 걸요.”"): 진우는 문장을 끝까지 맺는 인물인데 마지막 대사가 여운을 위한 미완문으로 끝난다. 예: “제가 아직 못 쓴 것을 쓰겠습니다.”처럼 끝맺어라.'
    preservedOriginal: false
  - sceneStem: 17-scene-5-1
    checkedAt: '2026-08-23T15:23:47.765Z'
    revisionCount: 2
    remainingBlocking: 2
    instructions:
      - '장면 목적 ("그는 펜끝을 들었었다... 오진우: 명태가 시켰습니다. / ... 명태: 아직도 그걸 붙들고 있나."): 진우가 처음으로 명태의 이름을 밝히는 반전이 이미 완결됐는데, 곧바로 명태가 등장해 같은 사실을 재확인한다. 이 장면은 진우의 고백과 태도 변화를 절정으로 끝내거나, 명태의 대면은 다음 장면으로 분리해 반전의 힘을 유지하라.'
      - '반복 ("기록에는... / 기록으로 써요. / 다시 쓰려는 겁니다. / 그렇게 적겠습니다. / 적는다고 끝난 건 아니에요. / 적으세요."): ‘기록하고 적는다’는 대화가 같은 기능으로 연속 반복된다. 진우가 수첩을 펴는 장면과 명태의 이름을 적는 결단만 남기고, 중간의 반복된 요구·다짐은 압축하라.'
      - '장면 목적 ("오진우: 둘 다였을 겁니다. 그 말이면, 그때는 끝인 줄 알았습니다."): ‘그 말’과 ‘둘 다’의 지시 대상이 불명확해 명태가 무엇을 치우라고 했는지 잠시 흐려진다. 명태의 지시가 밧줄과 섬유 증거의 정리였는지, 밧줄만의 회수였는지 구체화하라.'
    preservedOriginal: false
  - sceneStem: 18-scene-5-2
    checkedAt: '2026-08-23T15:25:20.334Z'
    revisionCount: 1
    remainingBlocking: 0
    instructions:
      - '반복 ("“앞치마 하나가 아니잖아요.” / “앞치마가 거기 있었다고 사람이 다 거기 있던 건 아니여.” / “그럼 어머니는 왜 사진을 지우라고 했어요?”"): 앞치마가 복순의 현장성을 뜻한다는 공방이 여러 차례 같은 정보로 반복된다. 한두 번의 대치로 압축하고, 이후에는 복순이 현장에 있던 이유나 구조 지연과의 관계를 새 정보로 진전시켜라.'
      - '반복 ("“사고 전에, 상점 앞에서. 누가 있었고, 무슨 말을 했는지요.” / “사고 전이에요. 사진 시간이 구조 지연 전을 가리켜요. 그때 상점 앞에서 뭘 했어요?”"): 사진의 시각이 사고·구조 지연 전이라는 확인과 상점 앞 행동을 묻는 질문이 연달아 되풀이된다. 뒤 질문은 복순이 ‘늦으면 안 되는 일’을 막으려 했다는 고백을 구체화하는 방향으로 바꿔 장면의 상태를 전진시켜라.'
    preservedOriginal: false
  - sceneStem: 19-scene-5-3
    checkedAt: '2026-08-23T15:33:45.263Z'
    revisionCount: 2
    remainingBlocking: 2
    instructions:
      - '설정 모순: "“바깥물 들기 전, 내가 물 밖으로 나와서 했제. 사람이 하나 떠내려간다 했어.”" — 임복순은 실종 당일 물때에 맞춰 방파제 바깥 바다에 들어가 있었다는 설정과 달리, 바깥물이 들기 전에 이미 물 밖으로 나와 있었다고 말한다.'
      - '캐릭터 보이스 ("분노는 아직 어머니 곁을 떠나지 않았고"): 감정을 직접 명명하지 말고, 서연이 전표를 쥔 손이나 어머니를 대하는 몸짓으로 분노가 남아 있음을 보여줘.'
    preservedOriginal: false
  - sceneStem: 20-scene-5-4
    checkedAt: '2026-08-23T15:38:31.327Z'
    revisionCount: 1
    remainingBlocking: 0
    instructions:
      - '반복 ("“그래서 하린은 돌아오지 못해도 됐어요?” / “그래서 하린은 돌아오지 못해도 됐어요?”"): 같은 질문이 거의 같은 형태로 두 번 반복된다. 뒤의 문장은 삭제하거나, 명태가 합의서를 받으러 다녔다는 고백을 겨냥한 새 질문으로 바꿔 압박의 초점을 전환하라.'
      - '반복 ("“장비 고장과 무승인 증축. 둘 다 드러나고.” / “수리비 못 낸 항구라는 말이 돌면… 허가 취소는 시간문제였어요.”"): 장비 고장·무승인 증축·허가 취소의 인과가 앞선 대화에서 이미 충분히 드러났다. 후반 설명은 한두 문장으로 줄이고, 명태가 실종 처리를 선택한 직접적 행동이나 책임을 더 선명하게 드러내라.'
    preservedOriginal: false
  - sceneStem: 21-scene-6-1
    checkedAt: '2026-08-23T15:49:35.772Z'
    revisionCount: 2
    remainingBlocking: 2
    instructions:
      - '반복 ("“이 합의서에는 확인할 내용이 빠져 있습니다.” / “이 문서에 창고 관련 내용은 없습니다.” / “오늘 합의서에는 서명하지 않겠습니다.”"): 합의서의 누락과 서명 거부가 같은 의미로 여러 차례 재진술됩니다. 중간 대목들은 명태의 압박이나 주민들의 동요를 새 정보로 전진시키도록 압축하세요.'
      - '반복 ("“녹음으로 남기겠다고 했습니다.” / “구명태 씨가 제 생계와 가족을 언급하며…” / “잠겨 있다는 말도 녹음하겠습니다.” / “오늘 누가 무엇을 빼자고 했는지도요.”"): 진우의 녹음 행위와 ‘남긴다’는 선언이 반복됩니다. 처음 녹음을 켜는 장면과 마지막 기록 선언 중 하나에 기능을 집중하고, 나머지는 실제 기록의 효과나 주민 반응으로 바꾸세요.'
      - '반복 ("“아무도 펜을 들지 않았다.” 이후 “펜을 내려놓았다.”, “펜촉은 종이에 닿지 못한 채 허공에서 멎었다.”, “펜이 탁자 위에서 굴러갔다.”"): 주민들의 서명 보류를 펜의 움직임으로 연속해 보여 줍니다. 한두 개의 강한 이미지로 줄이고, 이후에는 서로 얼굴을 보는 반응과 공동 대응 고백에 집중하세요.'
    preservedOriginal: false
