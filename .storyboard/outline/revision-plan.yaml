    instructions:
      - '장면 목적 ("진우는 웃으려 했으나 소리를 내지 못했다."): 장면 의도에 있는 ‘기록을 읽고 울음을 삼킨다’는 감정 변화가 충분히 드러나지 않는다. 진우가 무전 기록이나 자신의 진술과 맞닥뜨린 직후, 울음을 억누르는 신체 반응을 구체적으로 넣어 전환점을 분명히 하라.'
      - '반복 ("“그럼 확인해야죠.” / “확인할 수 있을 때 가야죠.” / “미래가 창고로 갔는지는 확인해야 합니다.” / “그래서 지금 가야죠.”"): 창고로 가야 한다는 결론과 ‘확인’이라는 표현이 여러 차례 같은 정보로 반복된다. 무전의 의미를 확정한 뒤에는 진우의 책임 고백이나 출발 준비처럼 장면 상태를 실제로 바꾸는 대사만 남겨 압축하라.'
      - '반복 ("“방치 창고였네요.” / “방파제 아래가 아니었어요.” / “창고 지시는 빠졌고요.”"): 반전인 북쪽 방치 창고 지시가 처음 무전이 재생된 직후 이미 전달됐는데, 뒤에서 같은 발견을 다시 설명한다. 첫 발견 뒤에는 기록의 발신·수신 대상 또는 수색 배제의 이유를 새 정보로 전개하라.'
      - '반복 ("“지금 출발하면 조수에 길이 막힐 수 있습니다.” / “미래가 창고로 갔는지는 확인해야 합니다. 하지만 지금 길이 남아 있을지는 모르겠습니다.” / “물이 차면요?”"): 조수 때문에 길이 끊길 위험이 반복 설명된다. 한 번은 당시 사건의 조건을 입증하는 기록으로, 한 번은 현재 이동의 구체적 장애로만 남겨 기능을 구분하라.'
