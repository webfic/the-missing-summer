      - '장면 목적 ("“정미래가 사라진 날 무엇을 덮었는지. 그 대가를 누가 받아 갔는지.”"): 주민을 몰아붙이는 질문은 반복되지만, 이번 장면에서 새로 공개된 진실이나 결정적 증거가 구체화되지 않는다. 비닐봉투 속 사진·기록 가운데 하나를 제시해 명태의 행위와 보상 합의의 연결을 분명히 밝혀라.'
      - '반복 ("명태가 합의서를 한데 모아 품에 안았다. / 한참 뒤, 명태는 서류철을 탁자 위에 내려놓았다. / 명태는 서류철을 다시 책상 위에 내려놓았다."): 명태가 서류를 챙기려다 내려놓는 행동과 증거 보존 설명이 세 차례 반복된다. 첫 충돌에서 제지와 보존 결정을 확정하고, 뒤의 반복은 삭제한 뒤 명태의 퇴장이나 주민 분열의 결과로 장면을 진행시켜라.'
      - '반복 ("“보상금 끊기면 누가 책임질 건데요?” / “보상금은 더 멀어졌습니다.” / “보상금 못 받은 사람들이 누구를 먼저 볼지.”"): 보상금 중단의 위협이 같은 의미로 거듭 제시된다. 주민 한 명의 구체적인 손실이나 공동 대응 붕괴의 선택으로 압축해 경제적 대가를 한 번 강하게 보여줘라.'
      - '반복 ("복순이 창가로 걸어갔다. / 복순이 창가로 갔다."): 복순이 창가로 가서 바다와 마을을 보는 동작이 반복된다. 뒤의 동작은 다른 위치나 행동으로 바꾸거나 하나로 합쳐라.'
      - '캐릭터 보이스 ("바다는 보이지 않았지만, 그는 한참 그 너머를 봤다."): 임복순을 가리키는 서술이 남성 지시어 ‘그는’으로 되어 있다. ‘복순은’ 또는 ‘그녀는’으로 바로잡아 인물 지시를 일관되게 유지하라.'
