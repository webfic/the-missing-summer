entries:
  - sceneStem: 01-scene-1-1
    checkedAt: '2026-08-23T13:46:22.730Z'
    revisionCount: 2
    remainingBlocking: 2
    instructions:
      - '설정 모순: "하린을 마지막으로 봤다는 글자와 그 옆에 적힌 자신의 이름." — 설정에서는 한서연이 실종 당일 방파제에서 정미래를 마지막으로 본 목격자로 기록되어 있으나, 본문은 한서연이 하린을 마지막으로 봤다고 기록되어 있다고 서술한다.'
      - '장면 목적 ("정미래를 본 마지막 목격자로 조서에 기록되어 있다 / 하린이 사라진 날과 같았다."): 실종 인물의 이름이 정미래와 하린으로 엇갈린다. 한 인물의 이름으로 통일해 장면의 핵심 반전과 서연의 귀향 동기를 명확히 하라.'
    preservedOriginal: false
  - sceneStem: 02-scene-1-2
    checkedAt: '2026-08-23T13:51:36.956Z'
    revisionCount: 1
    remainingBlocking: 0
    instructions:
      - '장면 목적 ("화가 날수록 입을 다물던 버릇이 혀끝까지 올라왔다."): 감정을 직접 이름으로 설명했다. 입을 다물고 질문을 멈추는 행동만 남겨 서연의 상태 변화를 보여줘라.'
    preservedOriginal: false
  - sceneStem: 03-scene-1-3
    checkedAt: '2026-08-23T13:57:23.293Z'
    revisionCount: 1
    remainingBlocking: 0
    instructions:
      - '장면 목적 ("서연은 도면을 가방 안쪽에 밀어 넣었다."): 도면을 챙기는 행동은 있으나, 주민들의 수군거림에 잠시 움츠러드는 감정 변화가 드러나지 않는다. 수군거림을 감각적으로 받아 한 번 멈칫한 뒤 도면을 접어 넣게 보완하라.'
    preservedOriginal: false
  - sceneStem: 04-scene-1-4
    checkedAt: '2026-08-23T14:02:15.394Z'
    revisionCount: 0
    remainingBlocking: 2
    instructions:
      - '설정 모순: "열일곱 장하린 실종, 방파제 마지막 목격." — 설정에서 실종자는 정미래이며 장하린은 정미래의 조카다. 본문은 장하린을 실종자로 명시한다.'
      - |-
        장면 목적 ("‘열일곱 장하린 실종, 방파제 마지막 목격.’
        ...
        ‘공식 목격자 한서연.’"): 필요 설정에서는 서연이 정미래를 본 마지막 목격자로 기록되어 있으나, 본문은 실종자와 목격 대상을 장하린으로 바꿨다. 사건의 핵심 인물 이름을 하나로 통일해 기록의 모순을 추적하는 장면 목적이 흔들리지 않게 고쳐라.
      - |-
        반복 ("“하린아, 네가 혼자였던 적은 없었네.”
        ...
        “하린아. 이번엔 네가 혼자였다고 안 할게.”"): 같은 호명과 ‘혼자가 아니었다’는 선언이 짧은 간격으로 반복된다. 둘 중 하나를 삭제하거나, 하나는 서연의 다음 행동으로 바꿔 결심의 여운을 남겨라.
    preservedOriginal: true
    rejection:
      reason: too-short
      originalLength: 2462
      candidateLength: 2459
  - sceneStem: 05-scene-2-1
    checkedAt: '2026-08-23T14:11:07.073Z'
    revisionCount: 2
    remainingBlocking: 2
    instructions:
      - '캐릭터 보이스 ("“네 조서에 빠진 게 있어요. 네가 방파제에서 본 정미래.”"): 진우는 존댓말을 쉽게 풀지 않는 인물이므로 ‘네/네가’를 ‘서연 씨/서연 씨가’로 바꿔 일관되게 유지하라.'
      - '장면 목적 ("“그날, 기사에 나온 애 말고도 신고가 하나 있었습니다.”"): 핵심 반전 뒤에 별도 신고·원본 대장·교환원 단서를 연달아 추가해, 서연이 진우를 첫 증언 대상으로 확정하는 장면의 초점이 흐려졌다. 신고 단서는 다음 장면으로 넘기고, 여기서는 진우의 무심한 인정과 서연의 확신으로 마무리하라.'
      - '반복 ("“종결을 검토한 뒤 제 이름으로 서명했습니다.” / “서명은 당신 이름이었어.” / “종결을 검토한 뒤 제 이름으로 서명했습니다.”"): 진우의 종결 서명 사실이 짧은 간격으로 반복된다. 한 번은 삭제하고, 남긴 대화에서는 서명이 지닌 책임이나 당시 판단을 새 정보로 진전시켜라.'
    preservedOriginal: false
  - sceneStem: 06-scene-2-2
    checkedAt: '2026-08-23T14:16:14.447Z'
    revisionCount: 1
    remainingBlocking: 0
    instructions:
      - '반복 ("“기억 말고 기록으로.” / “당신은 기억을 찾겠다고 여기 남았잖아요.” / “네가 비운 걸 확인하러 남았어.”"): 장면의 핵심 전환은 이미 충분히 드러났습니다. 마지막 대화에서 ‘기억’과 ‘기록’의 대비를 한두 번 덜어내고, 수첩에 실제로 적히는 첫 항목으로 전환을 보여 주세요.'
    preservedOriginal: false
