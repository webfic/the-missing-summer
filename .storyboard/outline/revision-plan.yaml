    remainingBlocking: 0
    instructions:
      - '반복 ("“합의서가 나오기 전까진 움직이지 마요.” / “합의서가 나오기 전까진 조용히 하라고 했죠.”"): 보상 합의 전 침묵을 요구하는 대사가 거의 같은 내용으로 반복된다. 뒤의 대사는 장비 반출과 구조 요청 지연에 대한 새 압박이나 구체적 위협으로 바꿔 긴장을 진전시켜라.'
    preservedOriginal: false
  - sceneStem: 15-scene-4-3
    checkedAt: '2026-08-23T15:03:43.689Z'
